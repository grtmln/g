<!DOCTYPE html>
<html lang="sk" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milan Ferenčík — greatmilan — thinkfluencing difference</title>
<meta name="author" content="Milan Ferenčík">
<meta property="og:title" content="Milan Ferenčík — greatmilan — thinkfluencing difference">
<meta name="description" content="Milan Ferenčík — brand strategy, creative direction, copywriting, social media, advertising and PR. Catch my brainwave.">
<style>
:root{
  --fg:#f2f5f6;--mute:rgba(242,245,246,.66);--line:rgba(242,245,246,.28);--ts:0 2px 22px rgba(0,0,0,.55);
  --top:rgba(2,6,9,.55);--bot:rgba(2,6,9,.6);--pill:rgba(5,11,16,.35);--pillfg:#050b10;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="day"]{
  --fg:#fff;--mute:rgba(255,255,255,.78);--line:rgba(255,255,255,.38);--ts:0 2px 24px rgba(0,18,32,.6);
  --top:rgba(0,20,35,.3);--bot:rgba(0,20,35,.5);--pill:rgba(0,25,40,.35);--pillfg:#04202e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#050b10;color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:color .8s}
#sea{position:fixed;inset:0;width:100vw;height:100vh;height:100lvh;z-index:0;background:linear-gradient(#16242d,#060c11 60%,#03070a)}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(var(--top),transparent 24%,transparent 58%,var(--bot))}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top,0px)) 4vw 22px}
.logo{font-weight:800;-webkit-text-stroke:.5px currentColor;letter-spacing:.012em;font-size:26px;color:var(--fg);text-decoration:none;text-shadow:var(--ts)}
.logo i{font-style:normal;font-weight:800;-webkit-text-stroke:.5px currentColor}
#mode,#wx,#snd{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--fg);font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--pill);border:1px solid var(--line);border-radius:100px;padding:9px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#mode svg,#wx svg,#snd svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#mode .sun{display:none}
.ctl{display:flex;align-items:center;gap:10px}
#wx svg{display:none}
#snd line{transform-box:fill-box;transform-origin:center;transform:scaleY(.28);transition:transform .45s ease}
[data-snd="on"] #snd line{transition:transform .09s linear}
[data-wx="calm"] #wx .i-calm,[data-wx="waves"] #wx .i-waves,[data-wx="storm"] #wx .i-storm{display:block}
#fx,#rain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
@media(max-width:560px){#wx span,#snd span,#modeLabel{display:none}#mode,#wx,#snd{padding:10px 12px}}
[data-theme="day"] #mode .sun{display:block}[data-theme="day"] #mode .moon{display:none}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4vw 9vh;position:relative}
.kicker{font-size:clamp(13px,1.4vw,16px);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:18px;text-shadow:var(--ts)}
h1{font-weight:700;font-size:clamp(44px,10.5vw,170px);line-height:.92;letter-spacing:-.045em;text-shadow:var(--ts);opacity:.62}
h1 span{font-weight:inherit;display:block}
.hint{position:absolute;right:4vw;bottom:9vh;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-shadow:var(--ts)}
footer{min-height:60vh;display:flex;flex-direction:column;justify-content:flex-end;padding:12vh 4vw calc(5vh + env(safe-area-inset-bottom,0px))}
h2{font-weight:300;font-size:clamp(13px,1.3vw,16px);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:26px;text-shadow:var(--ts)}
span.mail{display:inline-block;align-self:flex-start;color:var(--fg);text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:clamp(15px,3.4vw,54px);line-height:1.1;text-shadow:var(--ts);overflow-wrap:anywhere}
.mailwrap{display:inline-block;align-self:flex-start;max-width:100%}
.eeg{display:block;width:100%;height:48px;margin-top:8px;overflow:visible}
.eeg path{fill:none;stroke:var(--fg);stroke-width:1.6;opacity:.85;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:40px;align-self:flex-start;color:var(--fg);text-decoration:none;font-size:18px;padding:18px 30px;
  border:1px solid var(--line);border-radius:100px;background:var(--pill);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.3s}
.cta:hover{background:var(--fg);color:var(--pillfg)}
.social{margin-top:52px;display:flex;gap:28px;flex-wrap:wrap;font-size:15px}
.social a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px;text-shadow:var(--ts)}
.social a:hover{border-color:var(--fg)}
.copy{margin-top:48px;font-size:13px;color:var(--mute);text-shadow:var(--ts)}
@media(max-width:700px){.hint{display:none}}
#brain{position:fixed;left:0;top:0;z-index:50;pointer-events:none;width:200px;height:90px;margin:-47px 0 0 -100px;opacity:0;transition:opacity .3s;display:none}
@media (hover:hover) and (pointer:fine){#brain{display:block}html,html *{cursor:none!important}}
#brain.on{opacity:1}
.logo{display:block;position:relative;height:44px;width:172px;transition:width 2.2s cubic-bezier(.45,0,.25,1)}
.logo img{position:absolute;left:0;opacity:.82;filter:blur(0) drop-shadow(0 1px 12px rgba(0,0,0,.4));transform:translateX(0);transition:opacity 2.2s cubic-bezier(.45,0,.25,1),filter 2.2s cubic-bezier(.45,0,.25,1),transform 2.2s cubic-bezier(.45,0,.25,1)}
.logo .l1{top:2px;height:40px;width:auto}
.logo .l2{top:50%;margin-top:calc(min(340px,58vw) / -25.7);width:min(340px,58vw);height:auto;opacity:0;filter:blur(10px) drop-shadow(0 1px 12px rgba(0,0,0,.4));transform:translateX(-8px)}
.logo.swap{width:min(340px,58vw)}
.logo.swap .l1{opacity:0;filter:blur(10px) drop-shadow(0 1px 12px rgba(0,0,0,.4));transform:translateX(8px)}
.logo.swap .l2{opacity:.82;filter:blur(0) drop-shadow(0 1px 12px rgba(0,0,0,.4));transform:translateX(0)}
@keyframes dropIn{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
@keyframes h1In{from{opacity:0;transform:translateY(44px);filter:blur(10px)}to{opacity:.62;transform:none;filter:blur(0)}}
@keyframes riseIn{from{opacity:0;transform:translateY(30px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.logo{animation:dropIn 1.5s cubic-bezier(.16,.84,.24,1) .25s both}
.ctl{animation:dropIn 1.3s cubic-bezier(.16,.84,.24,1) .55s both}
.kicker{animation:riseIn 1.3s cubic-bezier(.16,.84,.24,1) .9s both}
h1{animation:h1In 1.8s cubic-bezier(.16,.84,.24,1) 1.1s both}
.rv{opacity:0;transform:translateY(32px);transition:opacity 1.1s cubic-bezier(.16,.84,.24,1),transform 1.1s cubic-bezier(.16,.84,.24,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.logo,.ctl,.kicker,h1{animation:none}.rv{opacity:1;transform:none;transition:none}}
footer h2{margin-bottom:0}
</style>
</head>

    if(n<1&&!bolt){if(rainOn){rg.clearRect(0,0,Wd,Hd);rainOn=false}return}
    rainOn=true;rg.clearRect(0,0,Wd,Hd);
    if(n>0){rg.strokeStyle='rgba(210,228,240,'+(.2*s).toFixed(3)+')';rg.lineWidth=1;rg.beginPath();
      for(var i=0;i<n;i++){var d=drops[i];d.y+=d.v*dt;d.x-=d.v*dt*.22;if(d.y>Hd){d.y=-d.l;d.x=Math.random()*(Wd+200)}if(d.x<-60)d.x+=Wd+120;
        rg.moveTo(d.x,d.y);rg.lineTo(d.x-d.l*.22,d.y+d.l)}rg.stroke()}
    if(bolt&&ft<.4){rg.save();rg.globalAlpha=Math.max(0,1-ft/.4)*(ft>.1&&ft<.2?.45:1);rg.strokeStyle='#eaf0ff';rg.shadowColor='rgba(170,190,255,.9)';rg.shadowBlur=18;rg.lineWidth=2;rg.lineJoin='round';
      rg.beginPath();bolt.forEach(function(q,i){i?rg.lineTo(q[0],q[1]):rg.moveTo(q[0],q[1])});rg.stroke();rg.restore()}
    else if(bolt&&ft>=.4)bolt=null}
  /* night extras: occasional satellite and meteor (2D overlay) */
  var fc=document.getElementById('fx'),fg=fc.getContext('2d'),sat=null,met=null,nextS=-1,nextM=-1,fxOn=false;
  function fsz(){fc.width=innerWidth;fc.height=innerHeight}fsz();addEventListener('resize',fsz);
  function fx(dt,now,nk){var Wd=fc.width,Hd=fc.height;
    if(nk<.3){nextS=-1;nextM=-1}
    else{
      if(nextS<0)nextS=now+10000+Math.random()*20000;
      if(nextM<0)nextM=now+3000+Math.random()*9000;
      if(!sat&&now>nextS){var d1=Math.random()<.5?1:-1;sat={x:d1>0?-10:Wd+10,y:Hd*(.08+Math.random()*.32),vx:d1*(Wd+20)/(30+Math.random()*16),vy:(Math.random()-.5)*8,age:0,dur:0,ecl:Math.random()<.4?.3+.4*Math.random():2};
        sat.dur=(Wd+20)/Math.abs(sat.vx);nextS=now+30000+Math.random()*50000}
      if(!met&&now>nextM){var d2=Math.random()<.5?1:-1,a=.2+Math.random()*.4;met={x:Wd*(.1+Math.random()*.8),y:Hd*(.04+Math.random()*.26),dx:d2*Math.cos(a),dy:Math.sin(a),dist:520+Math.random()*420,len:140+Math.random()*120,age:0,dur:.6+Math.random()*.5};
        nextM=now+9000+Math.random()*17000}
    }
    if(!sat&&!met){if(fxOn){fg.clearRect(0,0,Wd,Hd);fxOn=false}return}
    fxOn=true;fg.clearRect(0,0,Wd,Hd);var k=Math.min(1,nk*1.5);
    if(sat){sat.age+=dt;var p=sat.age/sat.dur;
      if(p>=1)sat=null;else{sat.x+=sat.vx*dt;sat.y+=sat.vy*dt;
        var al=Math.min(1,p*8,(1-p)*8)*(1-sm(sat.ecl,sat.ecl+.08,p))*(.8+.2*Math.sin(sat.age*3))*k;
        fg.save();fg.globalAlpha=Math.max(0,al);fg.fillStyle='#fffbe8';fg.shadowColor='rgba(255,250,220,.9)';fg.shadowBlur=6;fg.beginPath();fg.arc(sat.x,sat.y,1.3,0,6.283);fg.fill();fg.restore()}}
    if(met){met.age+=dt;var q=met.age/met.dur;
      if(q>=1)met=null;else{var e=1-Math.pow(1-q,2),hx=met.x+met.dx*met.dist*e,hy=met.y+met.dy*met.dist*e,L=met.len*Math.sin(Math.PI*q)+10,tx=hx-met.dx*L,ty=hy-met.dy*L;
        var gr=fg.createLinearGradient(hx,hy,tx,ty);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(180,210,255,0)');
        fg.save();fg.globalAlpha=Math.sin(Math.PI*Math.min(1,q*1.15))*k;fg.strokeStyle=gr;fg.lineWidth=1.7;fg.lineCap='round';fg.shadowColor='rgba(180,210,255,.9)';fg.shadowBlur=8;
        fg.beginPath();fg.moveTo(hx,hy);fg.lineTo(tx,ty);fg.stroke();fg.restore()}}}
  var t0=performance.now(),last=t0;
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;T=reduce?0:(now-t0)/1000;
    E=Math.min(1,E+moved*.0009);moved=0;E*=Math.pow(.9985,dt*60);
    cx+=(cxT-cx)*Math.min(1,dt*3);cz+=(czT-cz)*Math.min(1,dt*3);day+=(dayT-day)*Math.min(1,dt*4);
    W+=(WT-W)*Math.min(1,dt*1.1);
    var sS=Math.max(0,Math.min(1,W-1)),sC=Math.max(0,Math.min(1,1-W)),eB=W<1?.35*(1-W):.8*(W-1);
    U.uS.value=sS;U.uC.value=sC;U.uAmp.value=W<1?.3+.7*W:1+.4*(W-1);U.uK.value=W<1?W*W:1+.3*(W-1);U.uCh.value=sS*1.1;
    if(!reduce&&sS>.5){if(nextFl<0)nextFl=now+1500+Math.random()*3000;if(now>nextFl){fl0=now;nextFl=now+3500+Math.random()*7500;mkBolt();thunder()}}else if(sS<=.5)nextFl=-1;
    var ft=(now-fl0)/1000,fl=0;if(ft>=0&&ft<1)fl=Math.exp(-ft*9)*(.7+.3*Math.sin(ft*70))+(ft>.22?Math.exp(-(ft-.22)*10)*.6:0);
    U.uFl.value=Math.min(1,fl)*sS;
    if(!reduce){rain(dt,ft,sS);fx(dt,now,Math.pow(1-Math.min(1,day),2)*(1-sS))}
    U.uTime.value=T;U.uE.value=Math.max(E,eB);
    if(sndOn&&now-lastA>100){lastA=now;audioTick(Math.max(E,eB),sS)}
    if(sndOn)barsTick(now,Math.max(E,eB),sS);U.uCx.value=cx;U.uCz.value=cz;U.uDay.value=day;
    sunDir();
    
    dome.position.copy(cam.position);
    R.render(scene,cam);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
