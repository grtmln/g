<!DOCTYPE html>
<html lang="sk" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>greatmilan — thinkfluencing difference</title>
<meta name="description" content="Brand strategy, creative direction, copywriting, social media, advertising and PR. Catch my brainwave.">
<style>
:root{
  --fg:#f2f5f6;--mute:rgba(242,245,246,.66);--line:rgba(242,245,246,.28);--ts:0 2px 22px rgba(0,0,0,.55);
  --top:rgba(2,6,9,.55);--bot:rgba(2,6,9,.6);--pill:rgba(5,11,16,.35);--pillfg:#050b10;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="day"]{
  --fg:#fff;--mute:rgba(255,255,255,.78);--line:rgba(255,255,255,.38);--ts:0 2px 24px rgba(0,18,32,.6);
  --top:rgba(0,20,35,.3);--bot:rgba(0,20,35,.5);--pill:rgba(0,25,40,.35);--pillfg:#04202e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#050b10;color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:color .8s}
#sea{position:fixed;inset:0;width:100vw;height:100vh;height:100lvh;z-index:0;background:linear-gradient(#16242d,#060c11 60%,#03070a)}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(var(--top),transparent 24%,transparent 58%,var(--bot))}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top,0px)) 4vw 22px}
.logo{font-weight:800;-webkit-text-stroke:.5px currentColor;letter-spacing:.012em;font-size:26px;color:var(--fg);text-decoration:none;text-shadow:var(--ts)}
.logo i{font-style:normal;font-weight:800;-webkit-text-stroke:.5px currentColor}
#mode{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--fg);font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--pill);border:1px solid var(--line);border-radius:100px;padding:9px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#mode svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#mode .sun{display:none}
[data-theme="day"] #mode .sun{display:block}[data-theme="day"] #mode .moon{display:none}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4vw 9vh;position:relative}
.kicker{font-size:clamp(13px,1.4vw,16px);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:18px;text-shadow:var(--ts)}
h1{font-weight:700;font-size:clamp(44px,10.5vw,170px);line-height:.92;letter-spacing:-.045em;text-shadow:var(--ts);opacity:.8}
h1 span{font-weight:300;display:block}
.hint{position:absolute;right:4vw;bottom:9vh;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-shadow:var(--ts)}
footer{min-height:80vh;display:flex;flex-direction:column;justify-content:center;padding:12vh 4vw calc(8vh + env(safe-area-inset-bottom,0px))}
h2{font-weight:300;font-size:clamp(13px,1.3vw,16px);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:26px;text-shadow:var(--ts)}
a.mail{display:inline-block;align-self:flex-start;color:var(--fg);text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:clamp(15px,3.4vw,54px);line-height:1.1;text-shadow:var(--ts);overflow-wrap:anywhere}
.mailwrap{display:inline-block;align-self:flex-start;max-width:100%}
.eeg{display:block;width:100%;height:48px;margin-top:8px;overflow:visible}
.eeg path{fill:none;stroke:var(--fg);stroke-width:1.6;opacity:.85;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:40px;align-self:flex-start;color:var(--fg);text-decoration:none;font-size:18px;padding:18px 30px;
  border:1px solid var(--line);border-radius:100px;background:var(--pill);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.3s}
.cta:hover{background:var(--fg);color:var(--pillfg)}
.social{margin-top:44px;display:flex;gap:28px;flex-wrap:wrap;font-size:15px}
.social a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px;text-shadow:var(--ts)}
.social a:hover{border-color:var(--fg)}
.copy{margin-top:48px;font-size:13px;color:var(--mute);text-shadow:var(--ts)}
@media(max-width:700px){.hint{display:none}}
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="shade"></div>

<header>
  <!-- LOGO: nahraď týmto svojím pôvodným logom (img/svg) -->
  <a class="logo" href="#top">great<i>milan</i></a>
  <button id="mode" type="button" aria-label="Prepnúť deň / noc">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span id="modeLabel">night</span>
  </button>
</header>

<main id="top">
  <div class="hero">
    <div class="kicker">daydreamer &amp; nightthinker</div>
    <h1>thinkfluencing<span>difference</span></h1>
  </div>

  <footer id="contact">
    <h2>catch my brainwave</h2>
    <div class="mailwrap"><a class="mail" href="mailto:gmail@greatmilan.com">gmail@greatmilan.com</a>
    <svg class="eeg" viewBox="0 0 640 48" preserveAspectRatio="none" aria-hidden="true"><path id="eegp" d=""/></svg></div>
    <div class="social">
      <a href="https://twitter.com/greatmilan" target="_blank" rel="noopener">X</a>
      <a href="https://www.linkedin.com/in/greatmilan" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/greatmilan/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.facebook.com/greatmilan" target="_blank" rel="noopener">Facebook</a>
    </div>
    <div class="copy">by me ¯\_(ツ)_/¯ w &lt;3</div>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  /* day / night */
  var root=document.documentElement,btn=document.getElementById('mode'),lbl=document.getElementById('modeLabel'),day=0,dayT=0;
  function setMode(m,i){root.setAttribute('data-theme',m);lbl.textContent=m;dayT=m==='day'?1:0;if(i)day=dayT}
  setMode(matchMedia('(prefers-color-scheme: light)').matches?'day':'night',true);
  btn.addEventListener('click',function(){setMode(root.getAttribute('data-theme')==='day'?'night':'day')});
  /* brainwave effect on the e-mail */
  var eegp=document.getElementById('eegp'),mailEl=document.querySelector('a.mail'),amp=1,ampT=1,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  mailEl.addEventListener('pointerenter',function(){ampT=3.2});mailEl.addEventListener('pointerleave',function(){ampT=1});
  function eeg(now){var t=now/1000,d='';amp+=(ampT-amp)*.06;
    for(var x=0;x<=640;x+=4){var u=x/640,env=Math.sin(Math.PI*u),y=24+env*amp*(6*Math.sin(u*18-t*3)+4*Math.sin(u*41+t*5.3)+2.5*Math.sin(u*97-t*9));d+=(x?'L':'M')+x+' '+y.toFixed(1)}
    eegp.setAttribute('d',d);
    if(!still)requestAnimationFrame(eeg)}
  requestAnimationFrame(eeg);
  if(!window.THREE)return;
  var cv=document.getElementById('sea'),R;
  try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}catch(e){return}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
  var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(58,1,.5,2000);
  cam.position.set(0,3.2,34);cam.lookAt(0,7,0);
  function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
  resize();addEventListener('resize',resize);

  var U={uTime:{value:0},uE:{value:0},uCx:{value:0},uCz:{value:-30},uDay:{value:day},uL:{value:new THREE.Vector3(0,.06,-1).normalize()}};

  var COMMON='uniform float uTime,uDay;uniform vec3 uL;'+
  'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
  'float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}'+
  'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.03+7.1;a*=.5;}return s;}'+
  'vec3 sky(vec3 e){float y=max(e.y,0.);'+
  ' vec3 hor=mix(vec3(1.,.5,.24),vec3(.72,.86,.98),uDay),top=mix(vec3(.05,.04,.17),vec3(.10,.34,.78),uDay);'+
  ' vec3 c=mix(hor,top,smoothstep(0.,.6,y));'+
  ' c=mix(c,vec3(.55,.2,.4),smoothstep(.05,.2,y)*(1.-smoothstep(.2,.55,y))*(1.-uDay)*.7);'+
  ' vec2 cp=e.xz/(y+.18)*1.1+vec2(uTime*.01,0.);float cl=smoothstep(.3,.95,fbm(cp*.9))*.55;'+
  ' vec3 cc=mix(vec3(.18,.07,.14)+vec3(1.,.4,.15)*pow(1.-y,4.)*.7,vec3(.95,.97,1.)*(.8+.2*y),uDay);'+
  ' c=mix(c,cc,cl*smoothstep(.04,.25,y)*.8);'+
  ' float s=dot(e,uL);c+=mix(vec3(1.,.55,.2)*.9,vec3(1.,.9,.7)*.5,uDay)*pow(max(s,0.),mix(18.,22.,uDay))*(1.-cl*.6);'+
  ' c+=mix(vec3(1.,.8,.5),vec3(1.,.95,.8),uDay)*smoothstep(.9985,.9995,s)*4.;'+
    ' return c;}';

  /* sun left of center */
  var PITCH=Math.atan((7-3.2)/34),TH=Math.tan(29*Math.PI/180);
  function sunDir(){var cxs=-.36*TH*cam.aspect,cys=(-.03+.27*day)*TH;
    U.uL.value.set(cxs,Math.sin(PITCH)+cys*Math.cos(PITCH),cys*Math.sin(PITCH)-Math.cos(PITCH)).normalize()}
  sunDir();
  /* sky dome */
  var dome=new THREE.Mesh(new THREE.SphereGeometry(800,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:U,
    vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);}',
    fragmentShader:COMMON+'varying vec3 vD;void main(){vec3 c=sky(normalize(vD));c=pow(c,vec3(.9));gl_FragColor=vec4(c/(1.+c*.15),1.);}'}));
  dome.frustumCulled=false;scene.add(dome);

  /* sea: lagrangian grid displaced by 3 wave trains, forward shift at crest = overhanging, curling lip */
  var DISP='uniform float uE,uCx,uCz;'+
  'vec3 disp(vec2 g,out float foam){vec3 p=vec3(g.x,0.,g.y);foam=0.;'+
  ' for(int k=0;k<3;k++){float fk=float(k);float ph=fract(uTime*.028+fk/3.);'+
  '  float xc=mix(-110.,110.,ph)+5.*sin(g.y*.03+fk*2.)+2.5*sin(g.y*.11+fk*5.);'+
  '  float gx=exp(-pow((xc-uCx)/80.,2.));float pz=exp(-pow((g.y-uCz)/45.,2.));'+
  '  float A=16.*uE*smoothstep(0.,.2,ph)*(1.-smoothstep(.8,1.,ph))*(.35+.65*gx)*(.3+.7*pz)*(1.-smoothstep(14.,34.,g.y));'+
  '  float K=smoothstep(.2,.45,ph)*(.2+.8*pz)*(.5+.5*gx)*smoothstep(.15,.5,uE);'+
  '  float W=11.+5.*ph;float s=g.x-xc;float b=exp(-pow(s/W,2.));'+
  '  p.y+=A*b;p.x+=K*A*.95*exp(-pow((s+.2*W)/(.55*W),2.));'+
  '  foam+=K*min(1.,A*.25)*(smoothstep(.55,1.,b)+.6*exp(-pow((s-W)/(W*.9),2.)));}'+
  ' p.y+=.25*uE*sin(g.x*.35+uTime*1.3)*sin(g.y*.3-uTime*1.1);return p;}';
  var geo=new THREE.PlaneGeometry(260,300,520,360);geo.rotateX(-Math.PI/2);geo.translate(0,0,-40);
  var sea=new THREE.Mesh(geo,new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:U,
    vertexShader:COMMON+DISP+'varying vec3 vP,vN;varying float vF;void main(){vec2 g=position.xz;float a,b,c;'+
     'vec3 p=disp(g,a),px=disp(g+vec2(.35,0.),b),pz=disp(g+vec2(0.,.35),c);'+
     'vN=normalize(cross(pz-p,px-p));vP=p;vF=a;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}',
    fragmentShader:COMMON+'varying vec3 vP,vN;varying float vF;void main(){'+
     'vec3 V=normalize(vP-cameraPosition),N=normalize(vN);if(dot(N,-V)<0.)N=-N;'+
     'float dd=length(vP-cameraPosition);float fade=1.-smoothstep(30.,170.,dd);vec2 q=vP.xz*.8+vec2(uTime*.3,uTime*.1);vec3 dn=vec3(noise(q)-.5,0.,noise(q+9.)-.5)*.14+vec3(noise(q*2.7+3.)-.5,0.,noise(q*2.7+13.)-.5)*.09+vec3(noise(q*7.+5.)-.5,0.,noise(q*7.+21.)-.5)*.05;N=normalize(N+dn*fade);'+
     'float fr=mix(.03,1.,pow(1.-max(dot(N,-V),0.),5.));vec3 Rf=reflect(V,N);Rf.y=abs(Rf.y);vec3 refl=sky(Rf);'+
     'vec3 deep=mix(vec3(.01,.015,.035),vec3(0.,.07,.11),uDay),teal=mix(vec3(.18,.30,.32),vec3(0.,.45,.45),uDay);'+
     'float sss=pow(clamp(dot(normalize(uL+N*.5),V),0.,1.),4.)*smoothstep(1.,9.,vP.y);'+
     'vec3 col=mix(deep,teal*.5,smoothstep(0.,10.,vP.y));col+=mix(vec3(1.,.5,.15),vec3(.1,.85,.7),uDay)*sss*1.5;'+
     'col=mix(col,refl,fr);float rl=max(dot(reflect(V,N),uL),0.);col+=mix(vec3(1.,.6,.3),vec3(1.,.92,.75),uDay)*(pow(rl,500.)*14.+pow(rl,60.)*.9);'+
     'float fn=fbm(vec2(vP.x*.35-uTime*.5,vP.z*1.1))*.6+fbm(vP.xz*1.4+uTime*.2)*.4;float fm=clamp(smoothstep(.35,.7,fn+vF*.55-.2)*min(1.,vF*1.5),0.,1.);'+
     'vec3 fc=mix(vec3(1.,.8,.58),vec3(.94,.98,1.),uDay)*(.6+.5*max(dot(N,uL),0.)+sss*.9);col=mix(col,fc,fm);'+
     'float d=length(vP-cameraPosition);col=mix(col,sky(vec3(V.x,0.,V.z)),1.-exp(-d*d*.00012));'+
     'col=pow(col,vec3(.9));gl_FragColor=vec4(col/(1.+col*.15),1.);}'}));
  sea.frustumCulled=false;scene.add(sea);

  /* interaction */
  var E=0,cx=0,cxT=0,cz=-30,czT=-30,moved=0,lx=-1e4,ly=-1e4,T=0;
  function sm(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}
  function aim(e){cxT=(e.clientX/innerWidth-.5)*200;czT=-70+75*(e.clientY/innerHeight)}
  addEventListener('pointermove',function(e){var d=Math.hypot(e.clientX-lx,e.clientY-ly);if(d>20){moved+=d;lx=e.clientX;ly=e.clientY}aim(e)},{passive:true});
  addEventListener('pointerdown',function(e){E=Math.min(1,E+.5);aim(e)},{passive:true});
  setTimeout(function(){E=Math.max(E,.45)},1200);

  var t0=performance.now(),last=t0;
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;T=reduce?0:(now-t0)/1000;
    E=Math.min(1,E+moved*.0009);moved=0;E*=Math.pow(.9985,dt*60);
    cx+=(cxT-cx)*Math.min(1,dt*3);cz+=(czT-cz)*Math.min(1,dt*3);day+=(dayT-day)*Math.min(1,dt*4);
    U.uTime.value=T;U.uE.value=E;U.uCx.value=cx;U.uCz.value=cz;U.uDay.value=day;
    sunDir();
    
    dome.position.copy(cam.position);
    R.render(scene,cam);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
